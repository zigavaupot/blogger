<svg width="1040" height="360" viewBox="0 0 1040 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>OPAF connecting to Oracle Analytics Cloud via MCP</title>
<desc>High-level architecture: OPAF chat and agent tooling in the customer's own environment call an MCP server that bridges to Oracle Analytics Cloud's governed subject areas.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="1040" height="360" fill="#FFFFFF"/>

<text x="520" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#262019">OPAF chat connected to Oracle Analytics Cloud via MCP</text>

<!-- Container 1: customer environment -->
<rect x="20" y="70" width="470" height="220" rx="16" fill="none" stroke="#C74634" stroke-width="2" stroke-dasharray="7,5"/>
<text x="40" y="97" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#712B13">Your environment</text>
<text x="40" y="115" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D">Air-gapped on-premises or a cloud tenancy you control</text>

<!-- Box 1: OPAF chat -->
<rect x="40" y="140" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#D9D5CE" stroke-width="1"/>
<path d="M56 154 h26 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-16 l-7 7 v-7 h-3 a4 4 0 0 1 -4 -4 v-12 a4 4 0 0 1 4 -4 z" fill="none" stroke="#C74634" stroke-width="1.6" stroke-linejoin="round"/>
<text x="95" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#262019">OPAF chat</text>
<text x="95" y="192" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">User-facing interface</text>

<!-- Box 2: Agent and tool management -->
<rect x="280" y="140" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#D9D5CE" stroke-width="1"/>
<circle cx="308" cy="164" r="10" fill="none" stroke="#C74634" stroke-width="1.6"/>
<circle cx="304" cy="161" r="1.6" fill="#C74634"/>
<circle cx="312" cy="161" r="1.6" fill="#C74634"/>
<circle cx="308" cy="168" r="1.6" fill="#C74634"/>
<text x="335" y="168" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#262019">Agent &amp; tool mgmt</text>
<text x="335" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Registers the MCP tool</text>

<line x1="240" y1="185" x2="278" y2="185" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- MCP connector -->
<rect x="497" y="165" width="66" height="40" rx="20" fill="#FDF3F1" stroke="#C74634" stroke-width="1.6"/>
<text x="530" y="181" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#712B13">MCP</text>
<text x="530" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#993C1D">tool call</text>

<line x1="480" y1="185" x2="495" y2="185" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="565" y1="185" x2="588" y2="185" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Container 2: Oracle Analytics Cloud -->
<rect x="570" y="70" width="450" height="220" rx="16" fill="none" stroke="#C74634" stroke-width="2"/>
<text x="590" y="97" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#712B13">Oracle Analytics Cloud</text>
<text x="590" y="115" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D">Governed subject areas &amp; semantic model</text>

<!-- Box 3: OAC MCP server -->
<rect x="590" y="140" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#D9D5CE" stroke-width="1"/>
<rect x="606" y="154" width="26" height="8" rx="2" fill="none" stroke="#C74634" stroke-width="1.4"/>
<rect x="606" y="165" width="26" height="8" rx="2" fill="none" stroke="#C74634" stroke-width="1.4"/>
<circle cx="611" cy="158" r="1.3" fill="#C74634"/>
<circle cx="611" cy="169" r="1.3" fill="#C74634"/>
<text x="645" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#262019">OAC MCP server</text>
<text x="645" y="192" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Bridges agent to OAC</text>

<line x1="790" y1="185" x2="818" y2="185" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Box 4: Subject areas -->
<rect x="820" y="140" width="180" height="90" rx="10" fill="#FFFFFF" stroke="#D9D5CE" stroke-width="1"/>
<path d="M837 156 a9 3.2 0 1 1 18 0 a9 3.2 0 1 1 -18 0 M837 156 v12 a9 3.2 0 0 0 18 0 v-12" fill="none" stroke="#C74634" stroke-width="1.5"/>
<text x="866" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#262019">Subject areas</text>
<text x="866" y="192" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Governed logical SQL</text>

<!-- Caption -->
<text x="520" y="325" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">No new data model in OPAF — queries run live against subject areas your BI team already governs.</text>
</svg>
